# =========================================================================
#  F-08 — Anonymisation du serveur frontal (Nginx)
#
#  À inclure dans la config Nginx de l'ingress Azure Container Apps
#  (ou de tout autre reverse-proxy Nginx en amont de la stack MA2E).
#
#  Le rapport pentest v1.0 (F-08) a montré que Wappalyzer identifiait
#  `Server: nginx/1.22.1` sur https://ma2e.swedencentral.cloudapp.azure.com.
#  Cette config supprime la version en clair.
#
#  Deux niveaux :
#    1. `server_tokens off;` (nginx open-source, gratuit)
#       → transforme "Server: nginx/1.22.1" en "Server: nginx".
#    2. `more_set_headers "Server: MA2E";` (module `ngx_headers_more`)
#       → remplace complètement par la valeur qu'on veut.
#       Requiert le module `nginx-extras` (ou une compilation avec
#       ngx_headers_more). Sur Azure Container Apps, disponible via
#       une image nginx qui embarque ces extras (voir dockerfile plus bas).
#
#  Placement :
#    - directive `server_tokens off;` : dans le bloc `http {}` ou `server {}`
#    - directive `more_set_headers` : dans le bloc `server {}` OU `location /`
# =========================================================================

# --- Niveau 1 : neutraliser la version (compatible nginx standard) ---
server_tokens off;

# --- Niveau 2 : bannière personnalisée (requiert ngx_headers_more) ---
#     Décommenter si vous utilisez nginx-extras ou une image équivalente.
# more_set_headers "Server: MA2E";
# more_clear_headers "X-Powered-By";
# more_clear_headers "X-Nextjs-Cache";
# more_clear_headers "X-Nextjs-Matched-Path";
# more_clear_headers "X-Nextjs-Prerender";
# more_clear_headers "X-Nextjs-Stale-Time";

# --- Défense en profondeur — headers de sécurité complémentaires ---
#     Ces headers sont aussi posés par le backend FastAPI (middleware
#     SecurityHeadersMiddleware), mais on les rappelle ici pour couvrir
#     les cas où Nginx sert directement du contenu statique sans passer
#     par le backend.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

