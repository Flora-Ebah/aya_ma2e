# ═══════════════════════════════════════════════════════════════════════
# MA2E — Stack complète en Docker Compose
#
# Lance TOUT en une commande :
#   docker compose -f docker-compose.full.yml up --build -d
#
# Composants démarrés :
#   • postgres (16 + pgvector)  → port 55432
#   • redis (7)                 → port 56379
#   • minio                     → ports 59100 (S3) + 59101 (console)
#   • mailhog                   → ports 51025 (SMTP) + 58025 (web UI)
#   • backend FastAPI           → port 8000
#   • frontend Next.js          → port 3001
#
# Première utilisation :
#   1. Copier .env.example en .env et remplir les clés Azure/OCR/WhatsApp
#   2. docker compose -f docker-compose.full.yml up --build -d
#   3. docker compose -f docker-compose.full.yml exec backend python -m scripts.seed_all
#
# Vérification :
#   curl http://localhost:8000/health/liveness   → backend OK
#   curl http://localhost:3001                   → frontend HTML
#   http://localhost:58025                       → mails MailHog
#   http://localhost:59101                       → console MinIO (minioadmin/minioadmin)
# ═══════════════════════════════════════════════════════════════════════

services:

  # ─── Infrastructure ────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ma2e_postgres
    environment:
      POSTGRES_USER: vai
      POSTGRES_PASSWORD: vai_dev_password
      POSTGRES_DB: virtual_ai
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vai -d virtual_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ma2e_redis
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ma2e_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59100:9000"
      - "59101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ma2e_mailhog
    ports:
      - "51025:1025"
      - "58025:8025"
    restart: unless-stopped

  # ─── Application backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ma2e_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Infra — résolution par nom de service Docker (réseau interne)
      DATABASE_URL: postgresql+asyncpg://vai:vai_dev_password@postgres:5432/virtual_ai
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_BUCKET: ma2e-cni
      # SMTP local
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
      SMTP_FROM_EMAIL: no-reply@ma2e.ci
      SMTP_FROM_NAME: MA2E Notifications
      # Secrets Azure / OCR / WhatsApp — chargés depuis .env
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production_with_openssl_rand_hex_32}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "480"
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5.4-mini}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-04-01-preview}
      AZURE_OPENAI_EMBEDDING_ENDPOINT: ${AZURE_OPENAI_EMBEDDING_ENDPOINT:-}
      AZURE_OPENAI_API_KEY_EMBEDDING: ${AZURE_OPENAI_API_KEY_EMBEDDING:-}
      AZURE_AI_VISION_ENDPOINT: ${AZURE_AI_VISION_ENDPOINT:-}
      AZURE_AI_VISION_API_KEY: ${AZURE_AI_VISION_API_KEY:-}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      WHATSAPP_ACCESS_TOKEN_MA2E: ${WHATSAPP_ACCESS_TOKEN_MA2E:-}
      WHATSAPP_PHONE_ID_MA2E: ${WHATSAPP_PHONE_ID_MA2E:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-verify_me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/liveness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── Application frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL est figé au build → on prend l'URL qu'on veut
        # exposer publiquement. En dev local : http://localhost:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ma2e_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
